<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crash Incident Viewer</title>
<style>
:root {
  --bg: #f4f6f9; --fg: #1b2230; --muted: #5b6474; --card: #ffffff; --card2: #f8f9fb; --border: #dde2ea;
  --accent: #2563c9; --ok: #17804a; --warn: #a96300; --alert: #c02a2a; --violet: #6d4bc4; --teal: #0f7f86;
  --ok-bg: #e5f4ec; --warn-bg: #fdf1dc; --alert-bg: #fbe4e4; --accent-bg: #e4ecfa; --chip: #edf0f5;
  --mono: Consolas, "Cascadia Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --fg: #e3e8f0; --muted: #98a2b3; --card: #1a2029; --card2: #202734; --border: #2e3644;
    --accent: #6fa0f0; --ok: #4cc485; --warn: #e7a73c; --alert: #f07070; --violet: #a68cf0; --teal: #4ec3c9;
    --ok-bg: #173327; --warn-bg: #3a2c12; --alert-bg: #3d1c1c; --accent-bg: #1c2a44; --chip: #262e3b;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --fg: #e3e8f0; --muted: #98a2b3; --card: #1a2029; --card2: #202734; --border: #2e3644;
  --accent: #6fa0f0; --ok: #4cc485; --warn: #e7a73c; --alert: #f07070; --violet: #a68cf0; --teal: #4ec3c9;
  --ok-bg: #173327; --warn-bg: #3a2c12; --alert-bg: #3d1c1c; --accent-bg: #1c2a44; --chip: #262e3b;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.savedbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
header h1 { font-size: 17px; margin: 0; font-weight: 600; }
header .sub { color: var(--muted); font-size: 12.5px; }
header .spacer { flex: 1; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.card h3 { font-size: 14px; margin: 14px 0 6px; }
button { font: inherit; border: 1px solid var(--border); background: var(--card2); color: var(--fg); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, textarea:focus-visible, .tab:focus-visible, .ep:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { width: 100%; min-height: 120px; resize: vertical; font: 12.5px/1.4 var(--mono); color: var(--fg); background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.hint { color: var(--muted); font-size: 12.5px; }
.err { color: var(--alert); font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
.drop { border: 2px dashed var(--accent); }
#tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tab { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 6px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
.badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; letter-spacing: .02em; }
.s-OK { color: var(--ok); background: var(--ok-bg); } .s-WARN { color: var(--warn); background: var(--warn-bg); } .s-ALERT { color: var(--alert); background: var(--alert-bg); }
.verdict { border-left: 6px solid var(--muted); }
.verdict.v-OK { border-left-color: var(--ok); } .verdict.v-WARN { border-left-color: var(--warn); } .verdict.v-ALERT { border-left-color: var(--alert); }
.verdict .head { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
.verdict .host { font-size: 20px; font-weight: 650; }
.verdict .headline { font-size: 15.5px; margin: 8px 0 4px; }
.meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
.flags { margin: 8px 0 0; padding-left: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
dl.kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.caveat { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--chip); color: var(--fg); white-space: nowrap; }
.chip.t-ok { background: var(--ok-bg); color: var(--ok); } .chip.t-warn { background: var(--warn-bg); color: var(--warn); }
.chip.t-alert { background: var(--alert-bg); color: var(--alert); } .chip.t-accent { background: var(--accent-bg); color: var(--accent); }
ul.facts { margin: 4px 0 8px; padding-left: 18px; } ul.facts li { margin: 3px 0; }
.lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-top: 12px; }
.lbl.ok { color: var(--ok); } .lbl.no { color: var(--warn); } .lbl.ask { color: var(--accent); } .lbl.next { color: var(--violet); }
.hyp { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--card2); }
.hyp .ht { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.hyp ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
.hyp li.f::marker { content: "+  "; color: var(--ok); } .hyp li.a::marker { content: "-  "; color: var(--alert); } .hyp li.g::marker { content: "?  "; color: var(--warn); }
.h-supported { background: var(--accent-bg); color: var(--accent); } .h-weak { background: var(--chip); color: var(--muted); }
.h-not-supported { background: var(--chip); color: var(--muted); text-decoration: line-through; } .h-cannot-assess { background: var(--warn-bg); color: var(--warn); }
.eps { display: flex; flex-direction: column; gap: 6px; }
.ep { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--card2); }
.ep[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ep .n { font-weight: 700; color: var(--muted); }
.ep .who { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.tl { width: 100%; height: auto; display: block; margin: 6px 0 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.tbl { width: 100%; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
td.num, td.mono { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--card2); }
.tile .v { font-size: 20px; font-weight: 650; } .tile .k { color: var(--muted); font-size: 12px; }
.tile.hot .v { color: var(--warn); }
details summary { cursor: pointer; color: var(--muted); }
pre.raw { font: 11.5px/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: .95; }
.empty { color: var(--muted); font-style: italic; }
@media (max-width: 600px) {
  .wrap { padding: 10px; } dl.kv { grid-template-columns: 1fr; } dl.kv dt { margin-top: 6px; }
  header { flex-wrap: wrap; }
}
@media print {
  .no-print, #input, #tabs { display: none !important; }
  body { background: #fff; color: #000; } .card { break-inside: avoid; border-color: #bbb; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Crash &amp; Shutdown Incident Viewer</h1>
    <div class="sub">Renders output from System_Crash_And_Shutdown_Incident_Diagnostic.ps1. Runs entirely in this browser - nothing is uploaded.</div>
  </div>
  <div class="spacer"></div>
  <button id="themeBtn" class="no-print" type="button" aria-label="Toggle light or dark theme">Theme</button>
</header>

<div class="wrap">
  <section id="input" class="card" aria-label="Input">
    <h2>Paste the Atera output</h2>
    <textarea id="paste" spellcheck="false" placeholder="Paste the whole Atera script output (or just the JSON line). Several machines can be pasted at once."></textarea>
    <div class="row">
      <button id="renderBtn" class="primary" type="button">Render</button>
      <button id="fileBtn" type="button">Open file...</button>
      <input id="fileIn" type="file" accept=".txt,.json,.log" multiple hidden>
      <button id="demoBtn" type="button">Load demo</button>
      <button id="clearBtn" type="button">Clear</button>
      <span class="hint">You can also drop .txt / .json files onto the box. Mangled (&lt;&lt;&gt;&gt;) and line-wrapped pastes are recovered.</span>
    </div>
    <div id="err" class="err" role="alert"></div>
  </section>
  <div id="savedbar" class="savedbar no-print" hidden></div>
  <nav id="tabs" aria-label="Machines" role="tablist"></nav>
  <main id="report"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

    c.appendChild(el('h2', { text: 'Attribution logging (for the next restart)', style: 'margin-top:14px' }));
    var kv = el('dl', { class: 'kv' });
    [['Task Scheduler history', a.taskHistory], ['Process creation audit', a.processAudit], ['Command line in 4688', a.cmdLine]].forEach(function (r) {
      kv.appendChild(el('dt', { text: r[0] }));
      kv.appendChild(el('dd', null, el('span', { class: 'chip ' + (r[1] === 'on' ? 't-ok' : 't-warn'), text: str(r[1]) })));
    });
    c.appendChild(kv);
    arr(a.changed).forEach(function (x) { c.appendChild(el('p', { class: 'hint', text: 'Changed: ' + x })); });
    arr(a.notes).forEach(function (x) { c.appendChild(el('p', { class: 'hint', text: x })); });
    if (a.taskHistory !== 'on' || a.processAudit !== 'on' || a.cmdLine !== 'on')
      c.appendChild(el('p', { class: 'hint', text: 'Re-run the script with -EnableAttributionLogging so a recurrence records the caller (Task Scheduler history, process creation with command lines).' }));
    return c;
  }

  function renderDumps(p) {
    var c = el('section', { class: 'card' });
    var dc = p.dumpCap || {};
    c.appendChild(el('h2', { text: 'Crash dumps (presence alone never raises the verdict)' }));
    c.appendChild(el('p', null, 'Dump capture: ', el('span', { class: 'chip ' + (dc.status === 'OK' ? 't-ok' : 't-warn'), text: str(dc.status) }),
      ' ' + str(dc.type) + (arr(dc.reasons).length ? ' - ' + arr(dc.reasons).join('; ') : '')));
    var d = arr(p.dumps);
    if (!d.length) { c.appendChild(el('p', { class: 'empty', text: 'No crash dump files on disk.' })); return c; }
    var t = el('table'), tb = el('tbody');
    t.appendChild(el('thead', null, el('tr', null, el('th', { text: 'File' }), el('th', { text: 'Written' }), el('th', { text: 'Age' }), el('th', { text: 'Size' }), el('th', { text: 'Bugcheck' }), el('th', { text: 'Freshness' }))));
    d.forEach(function (x) {
      var tag = x.tag === 'matched' ? 'matched to #' + x.episode : str(x.tag);
      tb.appendChild(el('tr', null, el('td', { class: 'mono', text: str(x.name) }), el('td', { class: 'mono', text: fmtTime(x.written) }), el('td', { text: str(x.ageDays) + ' d' }),
        el('td', { text: str(x.sizeMB) + ' MB' }), el('td', { text: (x.bug ? x.bug + ' ' + str(x.bugName) : '-') }),
        el('td', null, el('span', { class: 'chip ' + (x.tag === 'matched' ? 't-alert' : (x.tag === 'historical' ? '' : 't-warn')), text: tag }))));
    });
    t.appendChild(tb);
    c.appendChild(el('div', { class: 'tbl' }, t));
    return c;
  }

  // ---------- save: a copy of this viewer with the report data embedded ----------
  function esc(s) { return str(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function stamp(iso) { return str(iso).slice(0, 16).replace(/[-:]/g, '').replace('T', '_'); }
  function buildSavedHtml(payloads) {
    var data = { savedAt: new Date().toISOString(), payloads: payloads };
    // Escaping "<" keeps the JSON from ever closing its script tag.
    var json = JSON.stringify(data).replace(/</g, '\\u003c').replace(new RegExp(String.fromCharCode(0x2028), 'g'), '\\u2028').replace(new RegExp(String.fromCharCode(0x2029), 'g'), '\\u2029');
    var host = payloads.length === 1 ? str(payloads[0].host) : payloads.length + ' machines';
    var html = PRISTINE;
    html = html.replace(/<script type="application\/json" id="saved-data">[\s\S]*?<\/script>/,
      function () { return '<script type="application/json" id="saved-data">' + json + '</' + 'script>'; });
    html = html.replace(/<script type="application\/json" id="demo-data">[\s\S]*?<\/script>/,
      function () { return '<script type="application/json" id="demo-data">[]</' + 'script>'; });
    html = html.replace(/<title>[\s\S]*?<\/title>/, function () { return '<title>Crash incident - ' + esc(host) + '</title>'; });
    return html;
  }
  function saveReport(payloads) {
    var p = payloads[0] || {};
    var name = ('CrashIncident_' + (payloads.length === 1 ? str(p.host) : 'multiple') + '_' + stamp(p.generated)).replace(/[^A-Za-z0-9_.-]/g, '_') + '.html';
    var blob = new Blob([buildSavedHtml(payloads)], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: name, style: 'display:none' });
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Saved ' + name);
  }

  // ---------- plain-text summary for tickets / Gemini ----------
  function summaryText(p, ep) {
    var v = p.verdict || {}, L = [];
    L.push('Crash/shutdown diagnostic - ' + str(p.host) + ' - ' + fmtTime(p.generated));
    L.push('Verdict: ' + str(v.status) + ' (exit ' + str(v.exit) + ') - ' + str(v.headline));
    arr(v.incidentWhy).forEach(function (x) { L.push('  incident: ' + x); });
    arr(v.health).forEach(function (x) { L.push('  health: ' + x); });
    if (ep) {
      L.push('');
      L.push('Transition #' + ep.id + ': ' + str(ep.typeLabel || ep.type) + ' [confidence ' + str(ep.typeConf) + ']');
      L.push('  went down ' + fmtTime(ep.t0) + ', booted ' + fmtTime(ep.boot) + ' (down ' + fmtSpan(ep.downtimeSec) + ')');
      var i = ep.initiator;
      if (i && i.src === '1074') {
        L.push('  requested by ' + str(i.process) + ' on behalf of ' + str(i.user) + ' (' + str(i.action) + '), reason ' + str(i.code) + ' = ' + str(i.decoded));
        L.push('  initiator: ' + str(i.label) + ' [' + str(i.category) + ', ' + str(i.conf) + ']');
      } else if (i) L.push('  initiator: ' + str(i.label) + ' [' + str(i.category) + ']');
      if (ep.bug) L.push('  bugcheck: ' + ep.bug.code + ' ' + ep.bug.name + ' - ' + ep.bug.hint);
      L.push('Established:'); arr(ep.established).forEach(function (x) { L.push('  - ' + x); });
      L.push('Not established:'); arr(ep.notEstablished).forEach(function (x) { L.push('  - ' + x); });
      L.push('Explanations checked (correlation, not proof):');
      arr(ep.hyp).forEach(function (h) { L.push('  - ' + h.label + ': ' + str(h.status).toUpperCase() + (h.conf ? ' (' + h.conf + ')' : '')); });
      L.push('Ask the client:'); arr(ep.ask).forEach(function (x) { L.push('  - ' + x); });
      L.push('Next steps:'); arr(ep.next).forEach(function (x) { L.push('  - ' + x); });
    }
    return L.join('\n');
  }

  // ---------- wiring ----------
  function load(raw) {
    var err = document.getElementById('err');
    err.textContent = '';
    var r = extract(str(raw));
    if (!r.payloads.length) {
      err.textContent = 'No crashdiag JSON found. Paste the whole Atera output (it ends with a ===CRASHDIAG_JSON_BEGIN=== line), or the JSON line on its own.' +
        (r.notes.length ? '\n' + r.notes.join('\n') : '');
      return;
    }
    state.payloads = r.payloads; state.cur = 0; state.sel = {};
    if (r.notes.length) err.textContent = r.notes.join('\n');
    renderAll();
  }
  var paste = document.getElementById('paste');
  document.getElementById('renderBtn').addEventListener('click', function () { load(paste.value); });
  document.getElementById('clearBtn').addEventListener('click', function () { paste.value = ''; state.payloads = []; renderAll(); document.getElementById('err').textContent = ''; });
  document.getElementById('demoBtn').addEventListener('click', function () {
    var demo = [];
    try { demo = JSON.parse(document.getElementById('demo-data').textContent || '[]'); } catch (e) { demo = []; }
    if (!demo.length) { document.getElementById('err').textContent = 'No demo data is embedded in this copy.'; return; }
    paste.value = demo.map(function (d) { return 'Script execution summary (demo)\n...\n===CRASHDIAG_JSON_BEGIN===\n' + JSON.stringify(d) + '\n===CRASHDIAG_JSON_END===\n'; }).join('\n');
    load(paste.value);
  });
  var fileIn = document.getElementById('fileIn');
  document.getElementById('fileBtn').addEventListener('click', function () { fileIn.click(); });
  function readFiles(files) {
    var list = Array.prototype.slice.call(files || []), texts = [], left = list.length;
    if (!left) return;
    list.forEach(function (f, i) {
      var rd = new FileReader();
      rd.onload = function () { texts[i] = String(rd.result || ''); if (--left === 0) { paste.value = texts.join('\n'); load(paste.value); } };
      rd.readAsText(f);
    });
  }
  fileIn.addEventListener('change', function () { readFiles(fileIn.files); fileIn.value = ''; });
  paste.addEventListener('dragover', function (e) { e.preventDefault(); paste.classList.add('drop'); });
  paste.addEventListener('dragleave', function () { paste.classList.remove('drop'); });
  paste.addEventListener('drop', function (e) { e.preventDefault(); paste.classList.remove('drop'); if (e.dataTransfer && e.dataTransfer.files.length) readFiles(e.dataTransfer.files); });
  paste.addEventListener('paste', function () { setTimeout(function () { if (/CRASHDIAG_JSON|crashdiag\//.test(paste.value)) load(paste.value); }, 0); });

  var themeBtn = document.getElementById('themeBtn');
  try { var saved = localStorage.getItem('crashdiag-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) { /* no storage */ }
  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('crashdiag-theme', next); } catch (e) { /* no storage */ }
  });

  // A saved report opens straight into its data, with the paste box tucked away.
  var saved = null;
  try { saved = JSON.parse(document.getElementById('saved-data').textContent || '[]'); } catch (e) { saved = null; }
  var savedPayloads = saved ? (Array.isArray(saved) ? saved : arr(saved.payloads)) : [];
  if (savedPayloads.length) {
    state.payloads = savedPayloads; state.cur = 0; state.sel = {};
    document.getElementById('input').hidden = true;
    var bar = document.getElementById('savedbar');
    bar.hidden = false;
    add(bar, [el('span', { text: 'Saved report' + (saved.savedAt ? ' - saved ' + fmtTime(saved.savedAt) + ' UTC' : '') + '. Everything shown is embedded in this file.' }),
      el('button', { type: 'button', on: { click: function () { document.getElementById('input').hidden = false; bar.hidden = true; } } }, 'Paste other output...')]);
    renderAll();
  }

  // test hook: lets an automated check feed text without UI clicks
  window.__crashdiag = { load: load, extract: extract, state: state, buildSavedHtml: buildSavedHtml };
  // Redraw (timeline width) when the window width changes noticeably
  var lastW = window.innerWidth, rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (Math.abs(window.innerWidth - lastW) > 80 && state.payloads.length) { lastW = window.innerWidth; var y = window.scrollY; renderAll(); window.scrollTo(0, y); } }, 250);
  });
  // Crash_Incident_Viewer.html#demo opens straight into the demo (also used for screenshot tests)
  if (location.hash === '#demo') document.getElementById('demoBtn').click();
})();
</script>
</body>
</html>
